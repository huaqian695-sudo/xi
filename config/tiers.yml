# 八个档位。每个档位 = 用哪个 provider + 哪个模型 + 温度 + 预算。
# 换模型改这里；临时换用 /model 指令。

tiers:
  label:
    provider: siliconflow
    model: inclusionAI/Ling-mini-2.0   # 实测 0.89s（haiku 2.3s、deepseek 3.5-5s）
    temperature: 0.0
    max_tokens: 300
    timeout: 20           # 网络硬超时

  chat.reply:
    provider: opencode
    model: deepseek-v4.1-flash
    temperature: 0.7
    max_tokens: 16000
    timeout: 240

  chat.image:
    provider: opencode
    model: deepseek-v4.1-flash
    temperature: 0.7
    max_tokens: 16000
    timeout: 240

  chat.qa:
    provider: opencode
    model: deepseek-v4.1-flash
    temperature: 0.2
    max_tokens: 8000
    timeout: 120

  tick:
    provider: opencode
    model: deepseek-v4.1-flash
    temperature: 0.8
    max_tokens: 8000
    timeout: 240

  digest:
    provider: opencode
    model: deepseek-v4.1-flash
    temperature: 0.3
    max_tokens: 16000
    timeout: 300

  vision:
    provider: siliconflow
    model: Qwen/Qwen3-VL-32B-Instruct
    max_tokens: 300
    timeout: 45

  qq.operator:
    provider: opencode
    model: deepseek-v4.1-flash
    temperature: 0.1
    max_tokens: 1024
    timeout: 30
