# 汐自己。这个号是谁、什么时候醒、能用什么工具。
# /model 指令改的就是 overrides 这一节。

persona_id: xi
name: 汐

account:
  self_id: 3926113546        # QQ 号（接真通道时填）

# 主人：同一个真人，在不同平台上的号不一样。
# 判断"是不是主人"看这里，不是看单个 admin_id——换平台才认得出。
owner:
  name: 浅华
  accounts:
    stub: "1693395561"       # 终端
    qq: "1693395561"         # QQ

schedule:
  awake: ["07:00", "00:00"]  # 这段时间之外不主动

proactive:
  max_per_day: 0             # 0 = 不限
  min_gap_minutes: 60

tools:
  toolbox: 封装              # 封装 / 全量 / 自定义
  # 白名单：封装箱也按它过滤（全量箱不受限）。
  # 想让她更保守，就从这里删——比如只留 weather/web_search/memory_search。
  allow:                     # 封装箱的 9 件（还没实现的不在里面）
    - weather
    - web_search
    - web_fetch
    - ask_dsh
    - memory_search
    - memory_add
    - memory_close
    - send_file
    - qq_do
    # 待做：ask_dsh(M5) / send_file / qq_do(M6)

overrides: {}                # /model 写这里，例：{chat.reply: {model: xxx}}

memory:
  top_k: 10
  window_days: 3
  window_max_turns: 100
