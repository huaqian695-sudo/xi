# 全局：路径、日志、调度、预算、通道
# 改完不用重启，下一条消息就生效（读的时候看文件 mtime）

paths:
  store: store
  config: config

log:
  file: store/daemon.log
  rotate_mb: 5

schedule:
  tick_minutes: 30
  digest_at: "03:00"

budget:
  daily_tokens: 0        # 0 = 不限
  per_turn_steps: 6      # 一轮最多几次工具调用

channel:
  type: stub             # M0 用终端假前台；接 QQ 时改 qq
  ws_url: ws://127.0.0.1:3001
  token_file: ~/napcat/config/onebot11_3926113546.json

guards:
  quiet_hours: ["00:00", "07:00"]
  proactive_max_per_day: 0     # 0 = 不限
  min_gap_minutes: 60

privacy:
  force_redact: true

tools:
  max_output_chars: 0
  command_timeout: 0
