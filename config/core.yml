# 全局：路径、日志、调度、预算、通道
# 改完不用重启，下一条消息就生效（读的时候看文件 mtime）

paths:
  store: store                              # 数据根；试验时设 XI_STORE=store/_dev
  persona: store/processed/1-persona         # 人设不跟数据走（她进 git）
  config: config

log:
  file: store/daemon.log
  rotate_mb: 5

schedule:
  tick_minutes: 30
  digest_at: "03:00"

daemon:
  extract_daily: true    # 每天提炼一次（启动时先补跑）
  extract_at: "03:00"    # 提炼时间
  extract_batch: 60      # 每批多少轮对话（一天多的会分多批）
  weather_daily: true    # 每天预取天气（启动时先补一次）
  weather_at: "07:00"
  weather_cities: ["洛阳", "北京", "安阳"]

budget:
  daily_tokens: 0        # 0 = 不限
  per_turn_steps: 6      # 一轮最多几次工具调用

channel:
  type: stub             # M0 用终端假前台；接 QQ 时改 qq
  ws_url: ws://127.0.0.1:3001
  token_file: ~/napcat/config/onebot11_3926113546.json

guards:
  quiet_hours: ["00:00", "07:00"]
  proactive_max_per_day: 0     # 0 = 不限
  min_gap_minutes: 60

privacy:
  force_redact: true

tools:
  max_output_chars: 0
  command_timeout: 0

# 模型：true = 假模型（不联网、不花钱）；false = 真网关
# 也可以不配置：设环境变量 XI_USE_MOCK=1 强制假模型（测试/演示用）
llm:
  use_mock: false
