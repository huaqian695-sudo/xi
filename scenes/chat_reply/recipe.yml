场景: chat.reply
版本: 1

档位: chat.reply
工具箱: 封装
超时: 90
工具步: 6

# 块顺序有讲究：稳定的在前、易变的在后。
# 「此刻」每轮都在变，放太靠前会把前缀缓存切断，所以压到最后一块数据。
块:
  - 人格: self.md
  - 人格: chat.md
  - 人格: thinking.md
  - 常量: 陌生人警告
    当: 非管理员私聊
  - 动作: 上一轮
  - 状态: 情绪
  - 产品: 7.内心
    条数: 1
  - 产品: 5.记忆库
    查询: 当前消息
    top: 10
  - 工具箱: 封装
  - 常量: QQ操作清单
  - 产品: 4.事实块
    当: 有结论
  - 常量: 事实纪律
    当: 有结论
  - 常量: 标记与表情
  - 此刻: 时间场合
  - 常量: 输出规则

历史:
  - 产品: 2.交互流
    范围: 当前段
    上限: 100

用户:
  - 当前: 消息
  - 产品: 3.标注
    取: emotion_cue
